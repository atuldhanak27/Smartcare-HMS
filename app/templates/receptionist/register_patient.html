{% extends "base.html" %}
{% block title %}Register Patient{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-white fw-semibold"><i class="bi bi-person-plus"></i> Register New Patient</div>
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name *</label>
                            <input type="text" name="full_name" class="form-control" value="{{ form.full_name or '' }}" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Age *</label>
                            <input type="number" min="0" max="130" name="age" class="form-control" value="{{ form.age or '' }}" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Gender *</label>
                            <select name="gender" class="form-select" required>
                                <option value="">Select</option>
                                <option value="Male" {% if form.gender == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if form.gender == 'Female' %}selected{% endif %}>Female</option>
                                <option value="Other" {% if form.gender == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone *</label>
                            <input type="text" name="phone" class="form-control" value="{{ form.phone or '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ form.email or '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Blood Group</label>
                            <select name="blood_group" class="form-select">
                                <option value="">Unknown</option>
                                {% for bg in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}
                                <option value="{{ bg }}" {% if form.blood_group == bg %}selected{% endif %}>{{ bg }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Emergency Contact</label>
                            <input type="text" name="emergency_contact" class="form-control" value="{{ form.emergency_contact or '' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="2">{{ form.address or '' }}</textarea>
                        </div>
                    </div>

                    <div class="mt-4 d-flex justify-content-end gap-2">
                        <a href="{{ url_for('receptionist.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-sc-primary"><i class="bi bi-check-circle"></i> Register Patient</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
