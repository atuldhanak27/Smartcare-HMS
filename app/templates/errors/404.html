{% extends "base.html" %}
{% block title %}Not Found{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 60vh;">
    <i class="bi bi-question-circle display-1 text-secondary mb-3"></i>
    <h2>404 - Page Not Found</h2>
    <p class="text-muted">The page you're looking for doesn't exist.</p>
    <a href="{{ url_for('index') }}" class="btn btn-sc-primary mt-2">Go to Dashboard</a>
</div>
{% endblock %}
